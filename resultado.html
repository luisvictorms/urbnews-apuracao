<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resultado Urbnews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Rethink+Sans:ital,wght@0,400..800;1,800&display=swap" rel="stylesheet">
<style>
  /* layout do PSD "ARTE ELEIÇÕES GANHADORES - FEED E STORYS" */
  :root { --bg: #07252d; --bg2: #011218; --acc: #aefd04; --escuro: #012128; --etq: #0f2f38; --tx: #fff; --mut: #9fb8bf; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  body { font-family: "Rethink Sans", sans-serif; color: var(--tx); }

  #stage { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; overflow: hidden;
    background: var(--bg2) url(fundo.jpg) center / cover no-repeat; }
  #stage.h { width: 1920px; height: 1080px; }
  #stage.v { width: 1080px; height: 1920px; }
  #stage.f { width: 1080px; height: 1350px; background-position: center top; }
  #confete { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9; }
  .sim { position: absolute; z-index: 10; right: 30px; top: 30px; background: #d29922; color: #000; font-weight: 800;
    font-size: 20px; padding: 4px 12px; border-radius: 4px; }
  #rod { position: absolute; z-index: 4; bottom: 14px; left: 0; right: 0; text-align: center; font-weight: 500; font-size: 15px;
    color: rgba(159,184,191,.7); letter-spacing: 1px; }

  /* ---------- medidas por formato (px do PSD no feed) ---------- */
  #cena { position: absolute; inset: 0; transition: opacity .45s; }
  #cena.saindo { opacity: 0; }
  .f .n1 { --tag-top: 48px; --tag-w: 300px; --tag-h: 100px; --tag-fs: 57px; --tit-top: 162px; --tit-fs: 108px; --sub-top: 292px;
    --sub-fs: 28px; --foto-top: 375px; --foto-w: 430px; --foto-h: 600px; --gap: 0px; --rot-fs: 30px; --rot-h: 69px; --rot-w: 400px;
    --logo-top: 1170px; --logo-w: 330px; --num-fs: 76px;}
  .f .n2 { --tag-top: 88px; --tag-w: 330px; --tag-h: 88px; --tag-fs: 50px; --tit-top: 194px; --tit-fs: 112px; --sub-top: 322px;
    --sub-fs: 28px; --foto-top: 471px; --foto-w: 372px; --foto-h: 520px; --gap: 60px; --rot-fs: 20px; --rot-h: 50px; --rot-w: 330px;
    --logo-top: 1170px; --logo-w: 300px; --num-fs: 60px;}
  .v .n1 { --tag-top: 150px; --tag-w: 340px; --tag-h: 112px; --tag-fs: 64px; --tit-top: 290px; --tit-fs: 124px; --sub-top: 436px;
    --sub-fs: 32px; --foto-top: 540px; --foto-w: 566px; --foto-h: 790px; --gap: 0px; --rot-fs: 36px; --rot-h: 80px; --rot-w: 500px;
    --logo-top: 1600px; --logo-w: 420px; --num-fs: 100px;}
  .v .n2 { --tag-top: 190px; --tag-w: 360px; --tag-h: 100px; --tag-fs: 56px; --tit-top: 320px; --tit-fs: 124px; --sub-top: 466px;
    --sub-fs: 32px; --foto-top: 600px; --foto-w: 458px; --foto-h: 640px; --gap: 40px; --rot-fs: 24px; --rot-h: 58px; --rot-w: 360px;
    --logo-top: 1480px; --logo-w: 380px; --num-fs: 76px;}
  .h .n1 { --tag-top: 40px; --tag-w: 260px; --tag-h: 84px; --tag-fs: 48px; --tit-top: 136px; --tit-fs: 96px; --sub-top: 250px;
    --sub-fs: 24px; --foto-top: 318px; --foto-w: 280px; --foto-h: 390px; --gap: 0px; --rot-fs: 26px; --rot-h: 58px; --rot-w: 340px;
    --logo-top: 920px; --logo-w: 260px; --num-fs: 64px;}
  .h .n2 { --tag-top: 40px; --tag-w: 300px; --tag-h: 84px; --tag-fs: 46px; --tit-top: 136px; --tit-fs: 96px; --sub-top: 250px;
    --sub-fs: 24px; --foto-top: 318px; --foto-w: 265px; --foto-h: 370px; --gap: 90px; --rot-fs: 22px; --rot-h: 52px; --rot-w: 300px;
    --logo-top: 920px; --logo-w: 260px; --num-fs: 56px;}

  /* ---------- selo (caixa com bolinhas nos cantos) ---------- */
  .tag { position: absolute; left: 50%; top: var(--tag-top); min-width: var(--tag-w); height: var(--tag-h); padding: 0 28px;
    transform: translateX(-50%); display: grid; place-items: center; background: rgba(3,45,58,.88);
    border: 2px solid rgba(180,189,192,.55); font-weight: 800; font-size: var(--tag-fs); line-height: 1; white-space: nowrap;
    animation: carimbo .6s cubic-bezier(.2,1.5,.4,1) .1s both; }
  .tag::before, .tag::after { content: ""; position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #fff; }
  .tag::before { left: -6px; top: 16%; } .tag::after { right: -6px; bottom: 12%; }
  @keyframes carimbo { from { opacity: 0; transform: translateX(-50%) scale(2.2) rotate(-6deg); } }

  .tit { position: absolute; left: 0; right: 0; top: var(--tit-top); text-align: center; font-weight: 800; font-size: var(--tit-fs);
    line-height: 1; white-space: nowrap; animation: desce .6s cubic-bezier(.2,.8,.2,1) .3s both; }
  .sub { position: absolute; left: 0; right: 0; top: var(--sub-top); text-align: center; font-weight: 800; font-size: var(--sub-fs);
    line-height: 1; white-space: nowrap; letter-spacing: 1em; padding-left: 1em;
    animation: abre .9s cubic-bezier(.2,.8,.2,1) .45s both; }
  @keyframes desce { from { opacity: 0; transform: translateY(-30px); } }
  @keyframes abre { from { opacity: 0; letter-spacing: .1em; } }

  /* ---------- fotos com moldura verde e etiqueta ---------- */
  .fotos { position: absolute; left: 0; right: 0; top: var(--foto-top); display: flex; justify-content: center; gap: var(--gap); }
  .cart { position: relative; width: var(--foto-w); animation: pop .8s cubic-bezier(.3,1.5,.5,1) .55s both; }
  .n2 .cart:nth-child(1) { animation-name: entraEsq; } .n2 .cart:nth-child(2) { animation-name: entraDir; }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } }
  @keyframes entraEsq { from { opacity: 0; transform: translateX(-160px); } }
  @keyframes entraDir { from { opacity: 0; transform: translateX(160px); } }
  .mold { width: var(--foto-w); height: var(--foto-h); border: 6px solid var(--acc); border-radius: 28px; overflow: hidden;
    background: #0b2a33; display: grid; place-items: center; font-weight: 800; font-size: 120px; color: #2c5560;
    box-shadow: 0 0 34px rgba(174,253,4,.35), 0 30px 70px rgba(0,0,0,.55); position: relative;
    animation: brilho 2.6s ease-in-out 1.5s infinite; }
  .mold img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }  /* moldura na proporção da foto do TSE: não corta */
  @keyframes brilho { 50% { box-shadow: 0 0 60px rgba(174,253,4,.6), 0 30px 70px rgba(0,0,0,.55); } }
  .rot { position: absolute; left: 50%; bottom: calc(var(--rot-h) * -0.26); transform: translateX(-50%);
    min-width: var(--rot-w); max-width: calc(var(--foto-w) + 40px); height: var(--rot-h); padding: 0 26px; display: grid; place-items: center;
    background: var(--etq); border: 2px solid rgba(174,253,4,.55); border-radius: 6px;
    font-weight: 800; font-size: var(--rot-fs); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    box-shadow: 0 10px 30px rgba(0,0,0,.45); animation: rotIn .6s cubic-bezier(.2,.8,.2,1) 1s both; }
  @keyframes rotIn { from { opacity: 0; transform: translate(-50%, 24px); } }
  .num { position: absolute; left: -40px; right: -40px; top: calc(100% + var(--rot-h) * .26 + 10px); text-align: center;
    animation: rotIn2 .6s 1.1s both; }
  .num b { display: block; font-weight: 800; font-size: var(--num-fs); line-height: 1; color: #fff;
    font-variant-numeric: tabular-nums; letter-spacing: -1px; }
  .num b small { font-size: .55em; }
  .num > span { display: block; margin-top: 4px; font-weight: 600; font-size: calc(var(--num-fs) * .3); color: var(--mut); }
  @keyframes rotIn2 { from { opacity: 0; } }

  .logo { position: absolute; left: 50%; top: var(--logo-top); width: var(--logo-w); transform: translateX(-50%);
    animation: logoIn .7s 1.1s both; }
  .logo img { display: block; width: 100%; }
  @keyframes logoIn { from { opacity: 0; transform: translate(-50%, 20px); } }

  /* raios bem sutis atrás da foto (só no ELEITO) */
  .raios { position: absolute; width: 2400px; height: 2400px; left: calc(50% - 1200px);
    top: calc(var(--foto-top) + var(--foto-h) / 2 - 1200px); border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, rgba(174,253,4,.07) 0 5deg, transparent 5deg 16deg);
    -webkit-mask: radial-gradient(circle, #000 0 12%, transparent 48%); mask: radial-gradient(circle, #000 0 12%, transparent 48%);
    animation: raiosIn 1.4s ease-out .5s both, gira 50s linear infinite; }
  @keyframes raiosIn { from { opacity: 0; } }
  @keyframes gira { to { transform: rotate(360deg); } }

  /* aguardando */
  .espera .mold { border-color: rgba(174,253,4,.35); box-shadow: none; animation: none; font-size: 30px; font-weight: 600; color: var(--mut);
    text-align: center; padding: 30px; line-height: 1.4; }
  .espera .mold i { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--acc); margin: 20px 6px 0;
    animation: ponto 1.2s ease-in-out infinite; }
  .espera .mold i:nth-of-type(2) { animation-delay: .2s; } .espera .mold i:nth-of-type(3) { animation-delay: .4s; }
  @keyframes ponto { 50% { transform: translateY(-12px); opacity: .4; } }
</style>
</head>
<body>
<div id="stage">
  <div id="cena"></div>
  <canvas id="confete"></canvas>
  <div id="rod">Fonte: TSE</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="sync.js?v=20260926e"></script>
<script src="dados.js?v=20260926e"></script>
<script src="exportar.js?v=20260926e"></script>
<script>
// Resultado: eleito(s) ou os dois do 2º turno da disputa escolhida (celular, teclado ou #aba); fica parado após a animação.
// h = 1920x1080 · v = 1080x1920 (stories) · f = feed 1080x1350. ?numeros=0 esconde % e votos.
const FORMATO = { vertical: 'v', stories: 'v', feed: 'f' }[Q.get('formato')] || 'h';
const NUMEROS = Q.get('numeros') !== '0';
const FIXA = location.hash.slice(1) || Q.get('aba');
const stage = document.getElementById('stage');
stage.className = FORMATO;
if (SIM) stage.insertAdjacentHTML('beforeend', '<div class="sim">SIMULAÇÃO 2022</div>');

// deputados ficam de fora (dezenas de eleitos)
const DISPUTAS = ABAS.filter(a => !a.lista);
const ehEleito = c => c.st.startsWith('ELEITO') || c.st === 'MATEMATICAMENTE ELEITO';
const PREP = { am: 'DO', pa: 'DO', ma: 'DO', pi: 'DO', ce: 'DO', al: 'DE', sp: 'DE', rj: 'DO', mg: 'DE' };

/* ---------- cenas ---------- */
function titulos(aba, n) {
  if (aba.cargo === 1) return ['PRESIDENTE', 'DA REPÚBLICA'];
  const sub = `DO ESTADO ${PREP[aba.abr] || 'DE'} ${aba.local}`;
  if (aba.cargo === 5) return [n > 1 ? 'SENADORES' : 'SENADOR', sub];
  return ['GOVERNADOR', sub];
}
const ini = n => n.split(' ').map(w => w[0]).slice(0, 2).join('');
const cartao = c => `<div class="cart"><div class="mold"><span>${esc(ini(c.nome))}</span>
    <img src="${esc(c.foto)}" alt="" onerror="this.remove()"></div>
  <div class="rot">${esc(c.nome)}</div>
  ${NUMEROS ? `<div class="num"><b><span class="conta" data-alvo="${c.pct}">0,00</span><small>%</small></b><span>${fint(c.votos)} votos</span></div>` : ''}</div>`;
const logo = `<div class="logo"><img src="logo-2026.png" alt="urb.NEWS Eleições 2026"></div>`;

function montar(aba, d) {
  const cands = d ? d.cands : [];
  const n = cands.length > 1 ? 2 : 1;
  const [tit, sub] = titulos(aba, cands.length);
  const tag = !d ? 'AGUARDANDO' : d.tipo === 't2' ? '2º TURNO' : n > 1 ? 'ELEITOS' : 'ELEITO';
  const miolo = d ? cands.map(cartao).join('')
    : `<div class="cart"><div class="mold">Aguardando confirmação do TSE<br><i></i><i></i><i></i></div></div>`;
  return `<div class="${d ? '' : 'espera '}n${n}">
    ${d && d.tipo === 'eleito' ? '<div class="raios"></div>' : ''}
    <div class="tag">${tag}</div><div class="tit">${tit}</div><div class="sub">${sub}</div>
    <div class="fotos">${miolo}</div>${logo}</div>`;
}

// subtítulo longo ("DO ESTADO DO RIO DE JANEIRO"): aperta o espaçamento antes de diminuir a letra
function ajustarSub(el) {
  el.style.animation = 'none';                  // mede sem a animação de espaçamento em andamento
  const max = stage.offsetWidth - 80;
  const r = document.createRange();
  const larg = () => { r.selectNodeContents(el); return r.getBoundingClientRect().width / (stage.getBoundingClientRect().width / stage.offsetWidth); };
  let ls = 1;
  while (larg() > max && ls > .25) { ls -= .05; el.style.letterSpacing = ls + 'em'; el.style.paddingLeft = ls + 'em'; }
  if (larg() > max) caber(el, max);
  void el.offsetWidth; el.style.animation = '';
}

/* ---------- contagem e confete como função do tempo (ms desde o início da cena) ---------- */
// assim o estúdio consegue gerar qualquer quadro do vídeo; ao vivo, um loop chama __tick com o relógio real
const cv = document.getElementById('confete'), cx = cv.getContext('2d');
let comConfete = false, inicioCena = 0, loop = null;
const CORES = ['#aefd04', '#ffffff', '#90d62c', '#c9c6ca', '#dfff8a'];
function aleatorio(i, k) { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); }

function desenharConfete(ms) {
  const W = cv.width = stage.offsetWidth, H = cv.height = stage.offsetHeight;
  cx.clearRect(0, 0, W, H);
  const n = (ms - 900) / 1000 * 60;                 // quadros de física (60/s) desde o disparo
  if (!comConfete || n < 0) return false;
  let vivos = 0;
  for (let i = 0; i < 200; i++) {
    const x0 = W * (.15 + aleatorio(i, 1) * .7), y0 = -20 - aleatorio(i, 2) * 300;
    const vx = (aleatorio(i, 3) - .5) * 9, vy = 2 + aleatorio(i, 4) * 6;
    const x = x0 + vx * (1 - Math.pow(.99, n)) / .01, y = y0 + vy * n + .06 * n * (n + 1);
    if (y > H + 40) continue;
    vivos++;
    const r = aleatorio(i, 5) * 6 + (aleatorio(i, 6) - .5) * .3 * n;
    const w = 10 + aleatorio(i, 7) * 12, h = 6 + aleatorio(i, 8) * 8;
    cx.save(); cx.translate(x, y); cx.rotate(r); cx.scale(1, Math.cos(r * 2));
    cx.fillStyle = CORES[i % CORES.length]; cx.fillRect(-w / 2, -h / 2, w, h); cx.restore();
  }
  return vivos > 0;
}

function contagens(ms) {
  const p = Math.min(1, Math.max(0, (ms - 1100) / 1400));
  document.querySelectorAll('.conta').forEach(el => { el.textContent = fpct(+el.dataset.alvo * (1 - Math.pow(1 - p, 3))); });
  return p < 1;
}

window.__tick = ms => { const a = contagens(ms), b = desenharConfete(ms); return a || b; };

function tocar() {                                   // relógio real (fora do estúdio)
  cancelAnimationFrame(loop);
  inicioCena = performance.now();
  if (EXPORT) return;
  const passo = () => { if (window.__tick(performance.now() - inicioCena)) loop = requestAnimationFrame(passo); };
  loop = requestAnimationFrame(passo);
}

/* ---------- seleção (controle igual ao painel) ---------- */
const cena = document.getElementById('cena');
let atual = Math.max(0, DISPUTAS.findIndex(a => a.id === FIXA));
let chaveAtual = '';

function definida(aba) {
  const r = resultado(aba);
  if (!r) return null;
  const eleitos = r.cands.filter(ehEleito);
  const t2 = r.cands.filter(c => c.st === '2º TURNO');
  if (eleitos.length) return { aba, tipo: 'eleito', cands: eleitos.slice(0, 2), r };
  if (t2.length === 2) return { aba, tipo: 't2', cands: t2, r };
  return null;
}
const chave = (aba, d) => aba.id + (d ? d.tipo + d.cands.map(c => c.sq).join() : ':espera');

function mostrar(forcar) {
  const aba = DISPUTAS[atual];
  const d = definida(aba);
  const k = chave(aba, d);
  if (k === chaveAtual && !forcar) return;      // nada mudou: tela fica parada
  const tinha = !!chaveAtual;
  chaveAtual = k;
  cena.classList.add('saindo');
  setTimeout(() => {
    cena.innerHTML = montar(aba, d);
    cena.classList.remove('saindo');
    caber(cena.querySelector('.tit'), stage.offsetWidth - 80);
    ajustarSub(cena.querySelector('.sub'));
    comConfete = !!(d && d.tipo === 'eleito');
    tocar();
    if (EXPORT && d && !window.__exportPronto) { window.__exportPronto = true; Exportar.marcarPronto(); }
  }, tinha && !EXPORT ? 450 : 0);
}

// escolher a mesma disputa de novo repete a animação
function selecionar(i, remoto) {
  atual = (i + DISPUTAS.length) % DISPUTAS.length;
  history.replaceState(null, '', '#' + DISPUTAS[atual].id);
  if (!remoto && window.Sync) Sync.enviar(DISPUTAS[atual].id);
  mostrar(true);
}

window.aoAtualizar = () => {
  const r = resultado(DISPUTAS[atual]);
  document.getElementById('rod').textContent = r ? `Fonte: TSE · Última consulta às ${r.consulta}` : 'Fonte: TSE';
  mostrar(false);
};

// 0/P = Presidente · 1..9 = governadores · Shift+n = senado · ← → navegam · R repete a animação
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  const i = DISPUTAS.findIndex(a => a.id === abaPorTecla(e));
  if (i >= 0) selecionar(i);
  else if (k === 'arrowright' || k === ' ') selecionar(atual + 1);
  else if (k === 'arrowleft') selecionar(atual - 1);
  else if (k === 'r') mostrar(true);
});
addEventListener('hashchange', () => {
  const i = DISPUTAS.findIndex(a => a.id === location.hash.slice(1));
  if (i >= 0 && i !== atual) selecionar(i, true);
});
if (window.Sync) {
  Sync.on('aba', id => { const i = DISPUTAS.findIndex(a => a.id === id); if (i >= 0) selecionar(i, true); });
  Sync.on('ola', () => Sync.enviar(DISPUTAS[atual].id));
}
if (Q.get('rodizio')) setInterval(() => selecionar(atual + 1), +Q.get('rodizio') * 1000);

function escala() {
  const s = Math.min(innerWidth / stage.offsetWidth, innerHeight / stage.offsetHeight);
  stage.style.transform = `scale(${s}) translate(-50%, -50%)`;
}
addEventListener('resize', escala);
escala();
mostrar(true);
ciclo(DISPUTAS);
if (!EXPORT) setInterval(() => ciclo(DISPUTAS), SIM ? 5000 : 15000);
</script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OOH Urbnews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* OOH: telas de rua, totens e LED — pouca informação, letra grande, leitura à distância.
     Quatro famílias pela proporção: land (paisagem), port (retrato), faixa (≈3:1) e led (14:1).
     Tudo é medido em --u (1% da menor dimensão útil), então cada formato sai no tamanho exato. */
  :root { --bg2: #011218; --mut: #a9bec6; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  body { font-family: "Rethink Sans", sans-serif; color: #fff; }
  #stage { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; overflow: hidden; background: #000; }
  /* cada face é uma tela física (formatos comuns têm 1; o Super LED tem 3: lateral + frente + lateral) */
  .face { position: absolute; overflow: hidden; background: var(--bg2) url(fundo.jpg) center / cover no-repeat; --acc: #aefd04; }
  .face.apu { --acc: #00a2ff; }
  /* margem de segurança embaixo (padrão 50 px): só fundo, nenhuma informação — o conteúdo usa a altura que sobra */
  .u { position: absolute; inset: 0 0 var(--margem, 50px) 0; display: flex; }

  /* blocos comuns */
  .esq { display: flex; flex-direction: column; min-width: 0; animation: entra .7s cubic-bezier(.2,.8,.2,1) both; }
  .logo { display: block; }
  .tag { align-self: flex-start; font-weight: 800; line-height: 1; white-space: nowrap; color: #012128; background: var(--acc); border-radius: calc(var(--u) * .8); }
  .apu .tag { color: #fff; }
  .tit { font-weight: 800; line-height: .95; white-space: nowrap; text-transform: uppercase; }
  .loc { font-weight: 700; line-height: 1; white-space: nowrap; text-transform: uppercase; color: var(--mut); }
  .rod { font-weight: 600; color: var(--mut); white-space: nowrap; line-height: 1; }
  .dir { display: flex; min-width: 0; min-height: 0; }
  .ft { position: relative; overflow: hidden; background: #0b2a33; border: calc(var(--u) * .7) solid var(--acc); border-radius: calc(var(--u) * 2);
    aspect-ratio: .716; flex: none; display: grid; place-items: center; font-weight: 800; color: #2c5560; }
  .ft img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; }
  .apu .ft { border-width: calc(var(--u) * .4); border-radius: calc(var(--u) * 1); background: #fff; }
  .venc .ft { box-shadow: 0 0 calc(var(--u) * 4) rgba(174,253,4,.35); animation: brilho 2.6s ease-in-out 2s infinite; }
  @keyframes brilho { 50% { box-shadow: 0 0 calc(var(--u) * 7) rgba(174,253,4,.6); } }
  .nm { font-weight: 800; line-height: 1; white-space: nowrap; text-transform: uppercase; }
  .pa { font-weight: 600; line-height: 1; white-space: nowrap; color: var(--mut); text-transform: uppercase; }
  .pc { font-weight: 800; line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .pc small { font-size: .55em; }
  .barra { background: rgba(255,255,255,.12); border-radius: 99px; overflow: hidden; }
  .barra i { display: block; height: 100%; background: var(--acc); border-radius: 99px; transform-origin: left; animation: enche 1.4s cubic-bezier(.2,.8,.2,1) both; }
  .cand { display: flex; min-width: 0; animation: surge .6s cubic-bezier(.2,.8,.2,1) both; }
  .txt { display: flex; flex-direction: column; min-width: 0; }
  .espera { font-weight: 600; color: var(--mut); text-align: center; align-self: center; margin: auto; }
  .sim { position: absolute; right: calc(var(--u) * 1.5); top: calc(var(--u) * 1.5); background: #d29922; color: #000; font-weight: 800; padding: .2em .5em; border-radius: .2em; font-size: calc(var(--u) * 2.4); z-index: 5; }
  @keyframes entra { from { opacity: 0; transform: translateX(calc(var(--u) * -6)); } }
  @keyframes surge { from { opacity: 0; transform: translateY(calc(var(--u) * 5)); } }
  @keyframes enche { from { transform: scaleX(0); } }

  .land.apu .txt, .port.apu .txt { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
  .land.apu .txt .nm, .port.apu .txt .nm { grid-column: 1; grid-row: 1; align-self: end; }
  .land.apu .txt .pa, .port.apu .txt .pa { grid-column: 1; grid-row: 2; align-self: start; }
  .land.apu .txt .barra, .port.apu .txt .barra { grid-column: 1 / span 2; grid-row: 3; }
  .land.apu .txt .pc, .port.apu .txt .pc { grid-column: 2; grid-row: 1 / span 2; }

  /* retrato: nome na largura toda; partido + barra à esquerda e % à direita embaixo */
  .port.apu .txt .nm { grid-column: 1 / span 2; grid-row: 1; }
  .port.apu .txt .pa { grid-column: 1; grid-row: 2; align-self: end; }
  .port.apu .txt .barra { grid-column: 1; grid-row: 3; align-self: start; }
  .port.apu .txt .pc { grid-column: 2; grid-row: 2 / span 2; }

  /* ---------- LAND (16:9, 4:3) ---------- */
  .land .u { padding: calc(var(--u) * 6); gap: calc(var(--u) * 5); }
  .land .esq { width: 36%; flex: none; justify-content: space-between; }
  .land .logo { width: 72%; }
  .land .cab { display: flex; flex-direction: column; gap: calc(var(--u) * 2.2); }
  .land .tag { font-size: calc(var(--u) * 3.6); padding: .45em .6em; }
  .land .tit { font-size: calc(var(--u) * 10); }
  .land .loc { font-size: calc(var(--u) * 5); }
  .land .rod { font-size: calc(var(--u) * 2.4); }
  .land .dir { flex: 1; align-items: center; justify-content: center; }
  .land.venc .dir { gap: calc(var(--u) * 5); }
  .land.venc .cand { flex-direction: column; align-items: center; gap: calc(var(--u) * 2); max-width: 50%; }
  .land.venc .ft { height: calc(var(--u) * 56); }
  .land.venc .nm { font-size: calc(var(--u) * 4.6); }
  .land.venc .pc { font-size: calc(var(--u) * 10); color: #fff; }
  .land.apu .dir { flex-direction: column; align-items: stretch; gap: calc(var(--u) * 3); }
  .land.apu .cand { align-items: center; gap: calc(var(--u) * 3); height: calc(var(--u) * 22); }
  .land.apu .ft { height: 100%; }
  .land.apu .txt { flex: 1; column-gap: calc(var(--u) * 3); row-gap: calc(var(--u) * 1.6); }
  .land.apu .nm { font-size: calc(var(--u) * 5.2); }
  .land.apu .pa { font-size: calc(var(--u) * 3); }
  .land.apu .barra { height: calc(var(--u) * 2.2); margin-top: calc(var(--u) * .6); }
  .land.apu .pc { font-size: calc(var(--u) * 9); }
  .land .espera { font-size: calc(var(--u) * 5); }

  /* ---------- PORT (9:16 até 4:5) ---------- */
  .port .u { flex-direction: column; padding: calc(var(--u) * 7) calc(var(--u) * 7) calc(var(--u) * 6); gap: calc(var(--u) * 4); }
  .port .esq { align-items: center; text-align: center; gap: calc(var(--u) * 2.6); }
  .port .logo { width: 46%; margin-bottom: calc(var(--u) * 2); }
  .port .cab { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 2.4); }
  .port .tag { align-self: center; font-size: calc(var(--u) * 5); padding: .4em .6em; }
  .port .tit { font-size: calc(var(--u) * 12.5); }
  .port .loc { font-size: calc(var(--u) * 6); }
  .port .rod { font-size: calc(var(--u) * 3); text-align: center; }
  .port .dir { flex: 1; justify-content: center; align-items: center; }
  .port.venc .dir { gap: calc(var(--u) * 5); }
  .port.venc .cand { flex-direction: column; align-items: center; gap: calc(var(--u) * 2.4); height: 100%; min-width: 0; flex: 0 1 auto; }
  .port.venc .ft { flex: 1 1 0; height: auto; min-height: 0; max-height: calc(var(--u) * 100); }
  .port.venc .n2 .ft { max-width: calc(var(--u) * 40); }
  .port.venc .nm { font-size: calc(var(--u) * 6.4); }
  .port.venc .pc { font-size: calc(var(--u) * 14); }
  .port.apu .dir { flex-direction: column; align-items: stretch; gap: calc(var(--u) * 3.5); }
  .port.apu .cand { align-items: center; gap: calc(var(--u) * 4); flex: 1 1 0; min-height: 0; max-height: calc(var(--u) * 34); }
  .port.apu .ft { height: 100%; }
  .port.apu .txt { flex: 1; column-gap: calc(var(--u) * 3); row-gap: calc(var(--u) * 1.8); }
  .port.apu .nm { font-size: calc(var(--u) * 6); }
  .port.apu .pa { font-size: calc(var(--u) * 3.8); }
  .port.apu .barra { height: calc(var(--u) * 2.6); margin-top: calc(var(--u) * 1); }
  .port.apu .pc { font-size: calc(var(--u) * 11); }
  .port .espera { font-size: calc(var(--u) * 6); }

  /* retrato baixo (4:5 e 5:7: TOTEMP, TOTEMG, TEMBICI): cabeçalho compacto */
  .baixo .u { padding: calc(var(--u) * 6); gap: calc(var(--u) * 3.5); }
  .baixo .esq { gap: calc(var(--u) * 1.8); }
  .baixo .logo { width: 34%; margin-bottom: calc(var(--u) * 1); }
  .baixo .cab { gap: calc(var(--u) * 1.6); }
  .baixo .tag { font-size: calc(var(--u) * 4.2); }
  .baixo .tit { font-size: calc(var(--u) * 10.5); }
  .baixo .loc { font-size: calc(var(--u) * 5); }
  .baixo.apu .dir { gap: calc(var(--u) * 3); }
  .baixo.apu .nm { font-size: calc(var(--u) * 5.4); }
  .baixo.apu .pa { font-size: calc(var(--u) * 3.4); }
  .baixo.apu .pc { font-size: calc(var(--u) * 9.5); }
  .baixo.apu .txt { row-gap: calc(var(--u) * 1.2); }

  /* ---------- FAIXA (≈3:1) ---------- */
  .faixa .u { padding: calc(var(--u) * 8) calc(var(--u) * 9); gap: calc(var(--u) * 8); align-items: stretch; }
  .faixa .esq { width: calc(var(--u) * 84); flex: none; justify-content: space-between; }
  .faixa .logo { height: calc(var(--u) * 24); width: auto; align-self: flex-start; }
  .faixa .cab { display: flex; flex-direction: column; gap: calc(var(--u) * 3); }
  .faixa .tag { font-size: calc(var(--u) * 6.4); padding: .4em .55em; }
  .faixa .tit { font-size: calc(var(--u) * 17); }
  .faixa .loc { font-size: calc(var(--u) * 9); }
  .faixa .rod { font-size: calc(var(--u) * 4.4); }
  .faixa .dir { flex: 1; align-items: center; justify-content: space-around; gap: calc(var(--u) * 6); }
  .faixa .cand { align-items: center; gap: calc(var(--u) * 4); min-width: 0; }
  .faixa .ft { height: calc(var(--u) * 84); }
  .faixa .txt { gap: calc(var(--u) * 2.4); }
  .faixa .nm { font-size: calc(var(--u) * 9); }
  .faixa .pa { font-size: calc(var(--u) * 5.6); }
  .faixa .pc { font-size: calc(var(--u) * 22); }
  .faixa .barra { height: calc(var(--u) * 3.2); width: calc(var(--u) * 60); }
  .faixa .espera { font-size: calc(var(--u) * 9); }
  /* faixa estreita (≈3:1: OUTDOOR 2048x720, LED4 864x288): blocos menores; 2 fotos viram cartões em pé */
  .estreita .u { padding: calc(var(--u) * 7) calc(var(--u) * 6); gap: calc(var(--u) * 6); }
  .estreita .esq { width: calc(var(--u) * 72); }
  .estreita .logo { height: calc(var(--u) * 21); }
  .estreita .tit { font-size: calc(var(--u) * 15); }
  .estreita .tag { font-size: calc(var(--u) * 5.6); }
  .estreita .dir { gap: calc(var(--u) * 5); justify-content: space-evenly; }
  .estreita .cand { gap: calc(var(--u) * 3); }
  .estreita .ft { height: calc(var(--u) * 58); }
  .estreita .nm { font-size: calc(var(--u) * 7.4); }
  .estreita .pa { font-size: calc(var(--u) * 4.6); }
  .estreita .pc { font-size: calc(var(--u) * 15); }
  .estreita .barra { width: calc(var(--u) * 46); height: calc(var(--u) * 2.6); }
  .estreita.venc .n2 .cand { flex-direction: column; gap: calc(var(--u) * 2); }
  .estreita.venc .n2 .ft { height: calc(var(--u) * 52); }
  .estreita.venc .n2 .txt { align-items: center; gap: calc(var(--u) * 1.6); }
  .estreita.venc .n2 .pa { display: none; }

  /* ---------- LED (14:1, 240 px de altura) ---------- */
  .led .u { padding: calc(var(--u) * 8) calc(var(--u) * 14); gap: calc(var(--u) * 16); align-items: center; }
  .led .logo { height: calc(var(--u) * 78); flex: none; animation: entra .7s both; }
  .led .esq { flex-direction: row; align-items: center; gap: calc(var(--u) * 12); flex: none; }
  .led .cab { display: flex; flex-direction: column; gap: calc(var(--u) * 5); }
  .led .tag { font-size: calc(var(--u) * 13); padding: .35em .5em; }
  .led .tit { font-size: calc(var(--u) * 34); }
  .led .loc { font-size: calc(var(--u) * 18); }
  .led .dir { flex: 1; align-items: center; justify-content: space-around; gap: calc(var(--u) * 20); }
  .led .cand { align-items: center; gap: calc(var(--u) * 10); }
  .led .ft { height: calc(var(--u) * 84); border-width: calc(var(--u) * 2); border-radius: calc(var(--u) * 6); }
  .led .txt { display: grid; grid-template-columns: auto auto; align-items: center; column-gap: calc(var(--u) * 12); row-gap: calc(var(--u) * 6); }
  .led .txt .pc { grid-column: 2; grid-row: 1 / span 2; }
  .led .nm { font-size: calc(var(--u) * 28); align-self: end; }
  .led .pa { font-size: calc(var(--u) * 16); align-self: start; }
  .led .pc { font-size: calc(var(--u) * 62); }
  .led .barra { height: calc(var(--u) * 7); width: calc(var(--u) * 150); }
  .led .rod { font-size: calc(var(--u) * 13); flex: none; }
  .led .espera { font-size: calc(var(--u) * 30); }
  .led .esq .logo { display: none; }
</style>
</head>
<body>
<div id="stage"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="sync.js?v=20261004m"></script>
<script src="dados.js?v=20261004m"></script>
<script src="pesquisas.js?v=20261004m"></script>   <!-- só para ordenar os candidatos antes do 1º voto -->
<script src="formatos.js?v=20261004m"></script>
<script src="exportar.js?v=20261004m"></script>
<script>
// OOH: ?arte=vencedores|apuracao &fmt=<id em formatos.js> #aba (deputados nos vencedores: #df-ce:3)
const ARTE = Q.get('arte') === 'apuracao' ? 'apuracao' : 'vencedores';
const F = OOH[Q.get('fmt')] || OOH.widefhd;
const MARGEM = Q.has('margem') ? Math.max(0, +Q.get('margem') || 0) : 50;   // &margem=0 tira a margem
const W = F.w, H = F.h;
// faces [x, y, largura, altura]: o Super LED (L3D) tem 3 — lateral, frente e lateral; a faixa preta de baixo já é a margem
const FACES = (F.faces || [[0, 0, W, H]]).map(([x, y, w, h]) => {
  const mg = F.faces ? 0 : MARGEM, hu = h - mg, r = w / hu;                  // proporção da área útil
  const fam = r >= 6 ? 'led' : r >= 2.2 ? 'faixa' : r >= 1.15 ? 'land' : 'port';
  return { x, y, w, h, mg, r, fam, u: fam === 'port' ? w / 100 : hu / 100 };
});
const stage = document.getElementById('stage');
Object.assign(stage.style, { width: W + 'px', height: H + 'px' });

const lerId = id => { const [a, p] = String(id || '').split(':'); return { aba: ABAS.find(x => x.id === a) || ABAS[0], pos: Math.max(1, +p || 1) }; };
let { aba, pos } = lerId(location.hash.slice(1) || Q.get('aba'));
const ehEleito = c => c.st.startsWith('ELEITO') || c.st === 'MATEMATICAMENTE ELEITO';
const fmt = (n, c = 2) => n.toLocaleString('pt-BR', { minimumFractionDigits: c, maximumFractionDigits: c });
const ini = n => n.split(' ').filter(w => !/^(de|da|do|dos|das|e)$/i.test(w)).map(w => w[0]).slice(0, 2).join('').toUpperCase();
const QTD = { land: 3, port: 3, faixa: 2, led: 2 };

function titulo(aba, n) {
  if (aba.id === 'br') return 'PRESIDENTE';
  if (aba.cargo === 5) return n > 1 ? 'SENADORES' : 'SENADOR';
  if (aba.lista) return aba.titulo;
  return 'GOVERNADOR';
}

// ---------- o que mostrar ----------
function conteudo() {
  const r = resultado(aba);
  const loc = aba.id === 'br' ? 'BRASIL' : aba.local;
  if (ARTE === 'apuracao') {
    if (!r || !r.cands.length) return { tag: 'APURAÇÃO', tit: titulo(aba, 1), loc, espera: 'Aguardando os primeiros resultados do TSE' };
    return { tag: `${fmt(r.secoes)}% APURADO`, tit: titulo(aba, 1), loc, cands: r.cands.slice(0, 3),   // cada face corta em QTD[família]
      rod: `${r.turno === 2 ? '2º turno · ' : ''}Fonte: TSE · ${r.consulta}` };
  }
  if (!r) return { tag: 'AGUARDANDO', tit: titulo(aba, 1), loc, espera: 'Aguardando confirmação do TSE' };
  const eleitos = r.cands.filter(ehEleito), t2 = r.cands.filter(c => c.st.startsWith('2º TURNO'));
  if (aba.lista && eleitos.length) {
    if (pos > eleitos.length) { if (EXPORT) return { tag: 'AGUARDANDO', tit: titulo(aba, 1), loc, espera: 'Aguardando confirmação do TSE' }; pos = 1; }
    window.__totalEleitos = eleitos.length;
    const parc = eleitos[pos - 1].st.includes('PARCIAL');
    return { tag: `ELEITO${parc ? ' · PARCIAL' : ''} · ${pos}º MAIS VOTADO`, tit: titulo(aba, 1), loc, cands: [eleitos[pos - 1]], rod: parc ? `Parcial · ${fmt(r.secoes)}% apurado · Fonte: TSE` : 'Fonte: TSE' };
  }
  const proj = cs => cs.some(c => c.st.includes('PROJE'));
  const rodProj = `Projeção · ${fmt(r.secoes)}% apurado · Fonte: TSE`;
  if (!aba.lista && eleitos.length) { const e2 = eleitos.slice(0, 2), p = proj(e2);
    return { tag: (e2.length > 1 ? 'ELEITOS' : 'ELEITO') + (p ? ' · PROJEÇÃO' : ''), tit: titulo(aba, e2.length), loc, cands: e2, rod: p ? rodProj : 'Fonte: TSE' }; }
  if (!aba.lista && t2.length === 2) return { tag: '2º TURNO' + (proj(t2) ? ' · PROJEÇÃO' : ''), tit: titulo(aba, 1), loc, cands: t2, rod: proj(t2) ? rodProj : 'Fonte: TSE' };
  return { tag: 'AGUARDANDO', tit: titulo(aba, 1), loc, espera: 'Aguardando confirmação do TSE' };
}

// ---------- montagem ----------
const T = i => ({ ent: 500 + i * 180, num: 900 + i * 180, dur: 1500 });
function cand(c, i, n, FAM) {
  const foto = `<div class="ft" style="font-size:calc(var(--u) * ${FAM === 'led' ? 30 : 12})">${esc(ini(c.nome))}${c.foto ? `<img src="${esc(c.foto)}" alt="" onerror="this.remove()">` : ''}</div>`;
  const pc = `<div class="pc conta" data-i="${i}" data-alvo="${c.pct}">${fmt(c.pct)}<small>%</small></div>`;
  const t = T(i);
  if (ARTE === 'apuracao' || FAM === 'faixa' || FAM === 'led')
    return `<div class="cand" style="animation-delay:${t.ent}ms">${foto}<div class="txt"><div class="nm">${esc(c.nome)}</div><div class="pa">${esc(c.partido)}${c.votos && FAM !== 'led' ? ' · ' + fint(c.votos) + ' votos' : ''}</div>
      ${ARTE === 'apuracao' && FAM !== 'led' ? `<div class="barra"><i style="width:${Math.min(100, c.pct)}%;animation-delay:${t.num}ms"></i></div>` : ''}${pc}</div></div>`;
  return `<div class="cand" style="animation-delay:${t.ent}ms">${foto}<div class="nm">${esc(c.nome)}</div>${pc}</div>`;
}
function montar() {
  const d = conteudo();
  const logo = `<img class="logo" src="${ARTE === 'apuracao' ? 'logo.png' : 'logo-2026.png'}" alt="urb.NEWS Eleições 2026">`;
  stage.innerHTML = FACES.map(f => {
    const FAM = f.fam, cands = d.cands ? (ARTE === 'apuracao' ? d.cands.slice(0, QTD[FAM]) : d.cands) : [], n = cands.length;
    const cls = `face ${FAM} ${ARTE === 'apuracao' ? 'apu' : 'venc'}${FAM === 'faixa' && f.r < 3.3 ? ' estreita' : ''}${FAM === 'port' && f.r > .7 ? ' baixo' : ''}`;
    return `<div class="${cls}" style="left:${f.x}px;top:${f.y}px;width:${f.w}px;height:${f.h}px;--u:${f.u}px;--margem:${f.mg}px"><div class="u">
    ${FAM === 'led' ? logo : ''}
    <div class="esq">${FAM !== 'led' ? logo : ''}<div class="cab"><div class="tag">${esc(d.tag)}</div><div class="tit">${esc(d.tit)}</div><div class="loc">${esc(d.loc)}</div></div>
      ${FAM === 'land' || FAM === 'faixa' ? `<div class="rod">${esc(d.rod || 'Fonte: TSE')}</div>` : ''}</div>
    <div class="dir ${n > 1 ? 'n2' : ''}">${d.espera ? `<div class="espera">${esc(d.espera)}</div>` : cands.map((c, i) => cand(c, i, n, FAM)).join('')}</div>
    ${FAM === 'port' || FAM === 'led' ? `<div class="rod">${esc(d.rod || 'Fonte: TSE')}</div>` : ''}
  </div>${SIM ? '<div class="sim">SIMULAÇÃO 2022</div>' : ''}</div>`;
  }).join('');
  requestAnimationFrame(() => [...stage.querySelectorAll('.face')].forEach((el, i) => ajustar(el, FACES[i])));
  return d;
}

// textos longos diminuem até caber na largura do bloco (nomes de estado e de candidato)
function encolher(el, larg) {
  if (!el || larg <= 0) return;
  let fs = parseFloat(getComputedStyle(el).fontSize);
  const r = document.createRange(), k = stage.getBoundingClientRect().width / W;
  const w = () => { r.selectNodeContents(el); return r.getBoundingClientRect().width / k; };
  while (w() > larg && fs > 6) { fs *= .94; el.style.fontSize = fs + 'px'; }
}
function ajustar(face, f) {
  const FAM = f.fam, U = f.u;
  const esq = face.querySelector('.esq');
  if (FAM !== 'led') face.querySelectorAll('.cab > *').forEach(el => encolher(el, esq.clientWidth));
  else face.querySelectorAll('.cab > *').forEach(el => encolher(el, U * 150));
  const dir = face.querySelector('.dir'), cs = [...face.querySelectorAll('.cand')];
  if (FAM === 'land' && ARTE === 'vencedores' && cs.length) {       // 2 fotos lado a lado não passam da largura
    const gap = U * 5, larg = (dir.clientWidth - gap * (cs.length - 1)) / cs.length;
    const h = Math.min(U * 56, larg / .716 - U * 1.4);
    cs.forEach(c => { c.querySelector('.ft').style.height = h + 'px'; c.style.maxWidth = larg + 'px'; });
  }
  const empilha = getComputedStyle(dir).flexDirection === 'column';
  cs.forEach(c => {
    const ft = c.querySelector('.ft'), txt = c.querySelector('.txt'), pc = c.querySelector('.pc');
    let livre;
    if (empilha && txt) {
      const semPc = txt.clientWidth - (getComputedStyle(txt).display === 'grid' ? pc.offsetWidth + U * 3 : 0);
      encolher(c.querySelector('.nm'), FAM === 'port' ? txt.clientWidth : semPc);
      encolher(c.querySelector('.pa'), semPc);
      return;
    }
    else if (getComputedStyle(c).flexDirection === 'row') livre = dir.clientWidth / cs.length - ft.offsetWidth - U * (FAM === 'led' ? 14 : 5)
      - (FAM === 'led' ? pc.offsetWidth + U * 12 : 0);
    else livre = Math.max(c.clientWidth, (dir.clientWidth - U * 5 * (cs.length - 1)) / cs.length);
    c.querySelectorAll('.nm, .pa').forEach(el => encolher(el, livre));
  });
}

let casas = 2;
function contagens(ms) {
  let ativo = false;
  stage.querySelectorAll('.conta').forEach(el => {
    const t = T(+el.dataset.i), alvo = +el.dataset.alvo;
    const p = Math.min(1, Math.max(0, (ms - t.num) / t.dur));
    if (p < 1) ativo = true;
    el.innerHTML = fmt(alvo * (1 - Math.pow(1 - p, 3))) + '<small>%</small>';
  });
  return ativo;
}
window.__tick = contagens;

let chaveAtual = '', t0 = 0;
function mostrar(forcar) {
  const d = conteudo();
  const k = aba.id + pos + d.tag + (d.cands || []).map(c => c.nome + c.pct).join('|');
  if (k === chaveAtual && !forcar) return;
  chaveAtual = k;
  montar(); t0 = performance.now();
  if (EXPORT) { if (!d.espera && !window.__exportPronto) { window.__exportPronto = true; setTimeout(() => Exportar.marcarPronto(), 300); } return; }
  const loop = () => { if (contagens(performance.now() - t0)) requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
window.aoAtualizar = () => mostrar(false);
addEventListener('hashchange', () => { ({ aba, pos } = lerId(location.hash.slice(1))); mostrar(true); ciclo([aba]); });

function escala() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  stage.style.transform = `scale(${s}) translate(-50%, -50%)`;
}
addEventListener('resize', escala);
escala();
mostrar(true);
ciclo([aba]);
if (!EXPORT) setInterval(() => ciclo([aba]), SIM ? 5000 : 15000);
</script>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apuração Urbnews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14313d; --bg2: #0d1f27; --acc: #00a2ff; --tag: #c9c6ca;
    --tx: #ffffff; --mut: #9fb2bc; --line: rgba(255,255,255,.14);
    --map: #7d86bd; --map-hi: #a9b0e0; --map-side: #3d4677;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  body { font-family: Montserrat, sans-serif; color: var(--tx); }

  /* palco fixo 1920x1080, escalado para caber na janela */
  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px;
    transform-origin: 0 0; overflow: hidden;
    background:
      repeating-linear-gradient(118deg, rgba(255,255,255,.018) 0 1px, transparent 1px 9px),
      repeating-linear-gradient(28deg, rgba(255,255,255,.012) 0 1px, transparent 1px 13px),
      radial-gradient(ellipse 90% 80% at 30% 35%, #21414e 0%, var(--bg) 45%, var(--bg2) 100%); }

  /* ---------- marca ---------- */
  .marca { position: absolute; left: 96px; top: 72px; width: 360px; }
  .marca img { display: block; width: 100%; height: auto; }

  /* ---------- mapa ---------- */
  #mapa { position: absolute; left: 70px; top: 300px; width: 740px; height: 700px; overflow: visible; }
  #mapa .extr path { fill: var(--map-side); }
  #mapa .uf path { fill: var(--map); stroke: #c4c9ea; stroke-width: 1.1; stroke-linejoin: round;
    transition: fill .5s, filter .5s; }
  #mapa .uf path.nosso { fill: var(--map-hi); }
  #mapa .uf path.ativo { fill: var(--acc); filter: drop-shadow(0 0 14px rgba(0,162,255,.8)); }
  #mapa.todos .uf path { fill: #4f8fcf; }
  #mapa.todos .uf path.nosso { fill: var(--acc); }
  .pino > g { transition: transform .45s cubic-bezier(.3,1.6,.5,1); transform-origin: 0 0; }
  .pino .gota { fill: #1b2733; stroke: #fff; stroke-width: 2.5; }
  .pino .miolo { fill: #fff; }
  .pino text { fill: #fff; font: 700 21px Montserrat; paint-order: stroke; stroke: rgba(10,25,32,.85); stroke-width: 5px; }
  .pino.ativo > g { transform: scale(1.45); }
  .pino.ativo .gota { fill: var(--acc); }

  /* ---------- painel de resultados ---------- */
  #painel { position: absolute; left: 870px; top: 72px; width: 960px; height: 940px; }
  .sobre { display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 22px; letter-spacing: 4px; color: var(--mut); }
  .sobre i { width: 6px; height: 30px; background: var(--acc); border-radius: 2px; }
  .sobre .sim { background: #d29922; color: #000; letter-spacing: 1px; padding: 2px 10px; border-radius: 4px; font-size: 18px; font-weight: 800; }
  h1 { margin-top: 14px; line-height: .95; }
  h1 .cargo { display: block; font-weight: 300; font-size: 54px; letter-spacing: 2px; }
  h1 .local { display: block; font-weight: 900; font-size: 96px; letter-spacing: -1px; }

  .apur { margin-top: 24px; display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 6px 20px; }
  .apur .rot { font-weight: 600; font-size: 20px; letter-spacing: 3px; color: var(--mut); }
  .apur .val { font-weight: 800; font-size: 40px; font-variant-numeric: tabular-nums; }
  .apur .trilho { grid-column: 1 / -1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .apur .trilho b { display: block; height: 100%; width: 0; background: var(--acc); transition: width 1.2s cubic-bezier(.2,.8,.2,1); }

  #cands { margin-top: 24px; display: flex; flex-direction: column; gap: 12px; }
  .cand { display: grid; grid-template-columns: 108px 1fr 210px; gap: 0 26px; align-items: center;
    background: rgba(255,255,255,.045); border-left: 6px solid transparent; padding: 12px 22px 12px 12px; border-radius: 4px;
    opacity: 0; transform: translateX(40px); transition: opacity .45s, transform .45s cubic-bezier(.2,.8,.2,1); }
  .cand.in { opacity: 1; transform: none; }
  .cand.lider { border-left-color: var(--acc); background: rgba(0,162,255,.10); }
  .foto { width: 108px; height: 108px; border-radius: 6px; overflow: hidden; background: #0e2630; display: grid; place-items: center;
    font-weight: 800; font-size: 44px; color: var(--mut); }
  .foto img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; }
  .nome { font-weight: 800; font-size: 40px; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .part { font-weight: 500; font-size: 22px; color: var(--mut); margin-top: 4px; letter-spacing: 1px; }
  .part .st { display: inline-block; margin-left: 12px; background: var(--acc); color: #fff; font-weight: 800; font-size: 18px;
    letter-spacing: 2px; padding: 3px 10px; border-radius: 3px; vertical-align: 2px; }
  .part .st.t2 { background: #fff; color: var(--bg); }
  .barra { margin-top: 12px; height: 12px; background: var(--line); border-radius: 6px; overflow: hidden; }
  .barra b { display: block; height: 100%; width: 0; background: rgba(255,255,255,.75); border-radius: 6px;
    transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
  .lider .barra b { background: var(--acc); }
  .num { text-align: right; }
  .pct { font-weight: 900; font-size: 60px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -1px; }
  .pct small { font-size: 32px; font-weight: 700; }
  .votos { font-weight: 500; font-size: 21px; color: var(--mut); margin-top: 6px; font-variant-numeric: tabular-nums; }

  .vazio { font-weight: 500; font-size: 30px; color: var(--mut); padding: 40px 0; }

  /* rodapé */
  #rodape { position: absolute; left: 96px; right: 90px; bottom: 44px; display: flex; justify-content: space-between; align-items: center; }
  .fonte { font-weight: 500; font-size: 20px; color: var(--mut); letter-spacing: 1px; }
  .abas { display: flex; gap: 8px; }
  .abas span { font-weight: 700; font-size: 20px; letter-spacing: 2px; padding: 7px 14px; border-radius: 4px;
    color: var(--mut); border: 2px solid var(--line); transition: all .3s; }
  .abas span.on { background: var(--acc); border-color: var(--acc); color: #fff; }
  .abas span kbd { font: inherit; opacity: .6; margin-right: 6px; }

  /* troca de aba */
  #painel.saindo .troca { opacity: 0; transform: translateY(-14px); }
  .troca { transition: opacity .25s, transform .25s; }
</style>
</head>
<body>
<div id="stage">
  <div class="marca"><img src="logo.png" alt="urb.NEWS Eleições 2026"></div>

  <svg id="mapa" viewBox="-10 0 840 810"></svg>

  <div id="painel">
    <div class="troca">
      <div class="sobre"><i></i><span id="sobre">APURAÇÃO · 1º TURNO</span><span id="simtag"></span></div>
      <h1><span class="cargo" id="cargo">GOVERNADOR</span><span class="local" id="local">CEARÁ</span></h1>
      <div class="apur">
        <div class="rot">SEÇÕES APURADAS</div><div class="val" id="secoes">0,00%</div>
        <div class="trilho"><b id="secoesbar"></b></div>
      </div>
    </div>
    <div id="cands"></div>
  </div>

  <div id="rodape">
    <div class="fonte" id="fonte">Fonte: TSE</div>
    <div class="abas" id="abas"></div>
  </div>
</div>

<script src="brasil.js"></script>
<script>
/* ======================= configuração ======================= */
const Q = new URLSearchParams(location.search);
const SIM = Q.get('sim') === '1';
const SUBIR = Q.get('subir') === '1';   // simulação com apuração subindo (padrão: resultado final)
const TURNO = +(Q.get('turno') || (new Date() >= new Date('2026-10-11T00:00:00-03:00') ? 2 : 1));
const DICAS = Q.get('dicas') === '1';
const TSE = 'https://resultados.tse.jus.br';
const CICLO = SIM ? 'ele2022' : 'ele2026';
const DATAS = ['04/10/2026', '25/10/2026'];
// simulação usa a apuração real de 2022
const COD_SIM = { 1: { federal: '544', estadual: '546' }, 2: { federal: '545', estadual: '547' } };

// ordem das abas: tecla 0 = presidente, 1..6 = governadores (mesma ordem do mapa do pacote)
const ABAS = [
  { id: 'br', cargo: 1, abr: 'br', titulo: 'PRESIDENTE', local: 'BRASIL' },
  { id: 'am', cargo: 3, abr: 'am', titulo: 'GOVERNADOR', local: 'AMAZONAS' },
  { id: 'pa', cargo: 3, abr: 'pa', titulo: 'GOVERNADOR', local: 'PARÁ' },
  { id: 'ma', cargo: 3, abr: 'ma', titulo: 'GOVERNADOR', local: 'MARANHÃO' },
  { id: 'pi', cargo: 3, abr: 'pi', titulo: 'GOVERNADOR', local: 'PIAUÍ' },
  { id: 'ce', cargo: 3, abr: 'ce', titulo: 'GOVERNADOR', local: 'CEARÁ' },
  { id: 'al', cargo: 3, abr: 'al', titulo: 'GOVERNADOR', local: 'ALAGOAS' },
];

/* ======================= estado ======================= */
let codigos = SIM ? COD_SIM : { 1: {}, 2: {} };
if (Q.get('fed')) codigos[TURNO].federal = Q.get('fed');
if (Q.get('est')) codigos[TURNO].estadual = Q.get('est');
const dados = {};      // id -> {raw, turnoUsado, ok}
let atual = Math.max(0, ABAS.findIndex(a => a.id === (location.hash.slice(1) || Q.get('aba'))));
let autoTimer = null;

/* ======================= utilidades ======================= */
const num = s => parseInt(String(s || '0').replace(/\./g, ''), 10) || 0;
const pnum = s => parseFloat(String(s || '0').replace(',', '.')) || 0;
const fint = n => n.toLocaleString('pt-BR');
const fpct = x => x.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dec = s => { const t = document.createElement('textarea'); t.innerHTML = s || ''; t.innerHTML = t.value; return t.value.trim(); };
const MINUSC = new Set(['de', 'da', 'do', 'das', 'dos', 'e']);
const nomeBonito = s => dec(s).toLowerCase().split(/\s+/)
  .map((w, i) => (i && MINUSC.has(w)) ? w : w.replace(/(^|[-'])(\p{L})/gu, (m, a, b) => a + b.toUpperCase())).join(' ');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function eleDe(aba, turno) { return (codigos[turno] || {})[aba.cargo === 1 ? 'federal' : 'estadual']; }
function urlRes(aba, turno) {
  const e = eleDe(aba, turno);
  return `${TSE}/oficial/${CICLO}/${e}/dados-simplificados/${aba.abr}/${aba.abr}-c${String(aba.cargo).padStart(4, '0')}-e${String(e).padStart(6, '0')}-r.json`;
}
function urlFoto(aba, turno, sq) { return `${TSE}/oficial/${CICLO}/${eleDe(aba, turno)}/fotos/${aba.abr}/${sq}.jpeg`; }

/* ======================= TSE ======================= */
async function descobrir() {
  if (SIM || (codigos[TURNO].federal && codigos[TURNO].estadual)) return;
  try {
    const cfg = await fetch(`${TSE}/oficial/comum/config/ele-c.json`, { cache: 'no-cache' }).then(r => r.json());
    if (cfg.c !== CICLO) return;
    for (const pl of cfg.pl || []) {
      if (!DATAS.includes(pl.dt)) continue;
      for (const e of pl.e || []) {
        const cargos = new Set((e.abr || []).flatMap(a => (a.cp || []).map(c => c.cd)));
        for (const [cg, tipo] of [['1', 'federal'], ['3', 'estadual']]) {
          if (!cargos.has(cg)) continue;
          codigos[e.t] = codigos[e.t] || {};
          codigos[e.t][tipo] = codigos[e.t][tipo] || e.cd;
          if (e.cdt2) { codigos[2] = codigos[2] || {}; codigos[2][tipo] = codigos[2][tipo] || e.cdt2; }
        }
      }
    }
  } catch (e) { console.warn('config TSE', e); }
}

async function buscar(aba, turno) {
  if (!eleDe(aba, turno)) return null;
  const r = await fetch(urlRes(aba, turno), { cache: 'no-cache' });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

// simulação: reapresenta 2022 em ciclos de 22 min (20 subindo + 2 parado no final)
function simular(raw, aba) {
  const DUR = 20 * 60e3, CIC = 22 * 60e3;
  let p = SUBIR ? Math.min(1, (Date.now() % CIC) / DUR) : 1;
  p = 1 - Math.pow(1 - p, 1.6);
  const cand = raw.cand.map(c => {
    let h = 0; for (const ch of aba.id + c.sqcand) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    const desvio = ((h % 1000) / 1000 - .5) * .6 * (1 - p);
    return { ...c, vap: String(Math.max(0, Math.round(num(c.vap) * p * (1 + desvio)))), ...(p < 1 ? { st: '', e: 'n' } : {}) };
  });
  const tot = cand.reduce((s, c) => s + num(c.vap), 0) || 1;
  cand.forEach(c => c.pvap = (num(c.vap) / tot * 100).toFixed(2).replace('.', ','));
  const hora = new Date().toLocaleTimeString('pt-BR');
  return { ...raw, cand, pst: (p * 100).toFixed(2).replace('.', ','), ht: hora };
}

const cacheSim = {};
async function atualizar(aba) {
  try {
    let turno = TURNO, raw;
    if (SIM) {
      const k = aba.id + turno;
      if (!(k in cacheSim)) cacheSim[k] = await buscar(aba, turno);
      if (!cacheSim[k] && turno === 2) { turno = 1; const k1 = aba.id + 1; cacheSim[k1] = cacheSim[k1] || await buscar(aba, 1); raw = cacheSim[k1]; }
      else raw = cacheSim[k] && simular(cacheSim[k], aba);
    } else {
      raw = await buscar(aba, turno);
      // estado sem 2º turno: mostra o resultado final do 1º
      if (!raw && turno === 2) { turno = 1; raw = await buscar(aba, 1); }
    }
    if (raw) dados[aba.id] = { raw, turno, ok: Date.now() };
  } catch (e) { console.warn(aba.id, e); }
}

async function ciclo() {
  await descobrir();
  await Promise.all(ABAS.map(atualizar));
  render(false);
}

/* ======================= normalização ======================= */
function resultado(aba) {
  const d = dados[aba.id];
  if (!d) return null;
  const raw = d.raw;
  const cands = [...raw.cand].sort((a, b) => num(b.vap) - num(a.vap) || num(a.seq) - num(b.seq)).map(c => ({
    sq: c.sqcand, nome: nomeBonito(c.nm), numero: c.n, partido: dec(c.cc).split(' - ')[0].trim(),
    votos: num(c.vap), pct: pnum(c.pvap), st: dec(c.st).toUpperCase(), foto: urlFoto(aba, d.turno, c.sqcand),
  }));
  return { cands, secoes: pnum(raw.pst), consulta: new Date(d.ok).toLocaleTimeString('pt-BR'), turno: d.turno };
}

/* ======================= mapa ======================= */
const NOSSOS = { am: 'AM', pa: 'PA', ma: 'MA', pi: 'PI', ce: 'CE', al: 'AL' };
// ajuste fino da posição dos pinos (px no viewBox)
const PINO_AJUSTE = { AM: [0, -10], PA: [10, -40], MA: [0, -20], PI: [0, 0], CE: [0, -6], AL: [6, 0] };
function montarMapa() {
  const svg = document.getElementById('mapa');
  const B = window.BRASIL;
  let extr = '', uf = '', pinos = '';
  for (const [sigla, g] of Object.entries(B)) {
    const nosso = Object.values(NOSSOS).includes(sigla);
    extr += `<path d="${g.d}"/>`;
    uf += `<path id="uf-${sigla}" class="${nosso ? 'nosso' : ''}" d="${g.d}"/>`;
  }
  for (const [id, sigla] of Object.entries(NOSSOS)) {
    const [dx, dy] = PINO_AJUSTE[sigla] || [0, 0];
    const [x, y] = [B[sigla].c[0] + dx, B[sigla].c[1] + dy];
    pinos += `<g class="pino" id="pino-${id}" transform="translate(${x} ${y})">
      <g><path class="gota" d="M0,0 C-4,-10 -15,-17 -15,-29 A15,15 0 1 1 15,-29 C15,-17 4,-10 0,0Z"/>
      <circle class="miolo" cx="0" cy="-29" r="5.5"/>
      <text x="0" y="-52" text-anchor="middle">${sigla}</text></g></g>`;
  }
  svg.innerHTML = `<g class="extr" transform="translate(0 12)">${extr}</g><g class="uf">${uf}</g><g>${pinos}</g>`;
}

/* ======================= render ======================= */
function render(trocouAba) {
  const aba = ABAS[atual];
  const res = resultado(aba);
  // mapa
  const svg = document.getElementById('mapa');
  svg.classList.toggle('todos', aba.id === 'br');
  svg.querySelectorAll('.uf path').forEach(p => p.classList.toggle('ativo', p.id === 'uf-' + (NOSSOS[aba.id] || '')));
  svg.querySelectorAll('.pino').forEach(p => p.classList.toggle('ativo', p.id === 'pino-' + aba.id));
  // cabeçalho
  const turnoTxt = res && res.turno !== TURNO ? `RESULTADO DO 1º TURNO` : `APURAÇÃO · ${TURNO}º TURNO`;
  document.getElementById('sobre').textContent = turnoTxt;
  document.getElementById('simtag').innerHTML = SIM ? '<span class="sim">SIMULAÇÃO 2022</span>' : '';
  document.getElementById('cargo').textContent = aba.titulo;
  document.getElementById('local').textContent = aba.local;
  document.getElementById('secoes').textContent = fpct(res ? res.secoes : 0) + '%';
  document.getElementById('secoesbar').style.width = (res ? res.secoes : 0) + '%';
  document.getElementById('fonte').textContent = res ? `Fonte: TSE · Última consulta às ${res.consulta}` : 'Fonte: TSE';
  document.getElementById('abas').innerHTML = ABAS.map((a, i) =>
    `<span class="${i === atual ? 'on' : ''}">${DICAS ? `<kbd>${i}</kbd>` : ''}${a.id === 'br' ? 'BRASIL' : a.id.toUpperCase()}</span>`).join('');
  // candidatos
  const box = document.getElementById('cands');
  if (!res || !res.cands.length) {
    box.innerHTML = `<div class="vazio">Aguardando os primeiros resultados do TSE…</div>`;
    return;
  }
  const lista = res.cands.slice(0, res.turno === 2 ? 2 : 4);
  const liderSq = res.secoes > 0 ? lista[0].sq : null;
  const html = c => {
    const st = c.st === 'ELEITO' || c.st === 'MATEMATICAMENTE ELEITO' ? '<span class="st">ELEITO</span>'
      : c.st === '2º TURNO' ? '<span class="st t2">2º TURNO</span>' : '';
    const ini = c.nome.split(' ').map(w => w[0]).slice(0, 2).join('');
    const [int, dc] = fpct(c.pct).split(',');
    return `<div class="cand ${c.sq === liderSq ? 'lider' : ''}" data-sq="${c.sq}">
      <div class="foto"><img src="${esc(c.foto)}" alt="" onerror="this.remove()"><span>${esc(ini)}</span></div>
      <div><div class="nome">${esc(c.nome)}</div>
        <div class="part">${esc(c.partido)} · ${esc(c.numero)}${st}</div>
        <div class="barra"><b data-w="${c.pct}"></b></div></div>
      <div class="num"><div class="pct">${int}<small>,${dc}%</small></div><div class="votos">${fint(c.votos)} votos</div></div>
    </div>`;
  };
  const mesmos = !trocouAba && box.dataset.aba === aba.id &&
    [...box.children].map(e => e.dataset.sq).join() === lista.map(c => c.sq).join();
  if (mesmos) {
    // só atualiza números (sem piscar)
    lista.forEach((c, i) => {
      const el = box.children[i];
      const novo = document.createElement('div'); novo.innerHTML = html(c);
      const n = novo.firstElementChild;
      el.className = n.className + ' in';
      el.querySelector('.part').innerHTML = n.querySelector('.part').innerHTML;
      el.querySelector('.num').innerHTML = n.querySelector('.num').innerHTML;
      el.querySelector('.barra b').style.width = c.pct + '%';
    });
  } else {
    box.dataset.aba = aba.id;
    box.innerHTML = lista.map(html).join('');
    [...box.children].forEach((el, i) => setTimeout(() => {
      el.classList.add('in');
      const b = el.querySelector('.barra b'); b.style.width = b.dataset.w + '%';
    }, 120 + i * 110));
  }
}

function irPara(i) {
  i = (i + ABAS.length) % ABAS.length;
  if (i === atual) return;
  atual = i;
  history.replaceState(null, '', '#' + ABAS[i].id);
  const p = document.getElementById('painel');
  p.classList.add('saindo');
  setTimeout(() => { render(true); p.classList.remove('saindo'); }, 250);
}

/* ======================= teclado ======================= */
// 0 ou P = presidente · 1..6 = governadores · ← → navegam · A = rodízio automático
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (/^[0-9]$/.test(k) && +k < ABAS.length) irPara(+k);
  else if (k === 'p') irPara(0);
  else if (k === 'arrowright' || k === ' ') irPara(atual + 1);
  else if (k === 'arrowleft') irPara(atual - 1);
  else if (k === 'a') {
    if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
    else autoTimer = setInterval(() => irPara(atual + 1), (+Q.get('rodizio') || 10) * 1000);
  }
});
// vMix: BrowserNavigate para ...#ce troca a aba sem recarregar
addEventListener('hashchange', () => {
  const i = ABAS.findIndex(a => a.id === location.hash.slice(1));
  if (i >= 0) irPara(i);
});

/* ======================= escala ======================= */
function escala() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  document.getElementById('stage').style.transform = `scale(${s}) translate(-50%, -50%)`;
}
addEventListener('resize', escala);

escala();
montarMapa();
render(true);
ciclo();
setInterval(ciclo, SIM ? 3000 : 15000);
if (Q.get('rodizio')) autoTimer = setInterval(() => irPara(atual + 1), +Q.get('rodizio') * 1000);
</script>
</body>
</html>

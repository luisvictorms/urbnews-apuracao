<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07252d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Controle · Apuração Urbnews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:ital,wght@0,400..800;1,800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #07252d; --bg2: #011218; --acc: #aefd04; --escuro: #012128; --tx: #fff; --mut: #9fb2bc; --card: rgba(255,255,255,.06); --line: rgba(255,255,255,.14); }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body { font-family: "Rethink Sans", sans-serif; color: var(--tx); user-select: none;
    background: radial-gradient(ellipse at 30% 0%, #173541, var(--bg) 45%, var(--bg2));
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); min-height: 100vh; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  header img { height: 54px; }
  .con { font-size: 12px; font-weight: 600; color: var(--mut); text-align: right; line-height: 1.5; }
  .con i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #f85149; margin-right: 5px; }
  .con.ok i { background: #2ea043; }
  .noar { margin: 16px 0 4px; font-size: 13px; font-weight: 700; letter-spacing: 3px; color: var(--mut); }
  .noar b { color: var(--tx); }
  .grade { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button { font: inherit; color: inherit; background: var(--card); border: 2px solid var(--line); border-radius: 12px;
    padding: 16px 14px; text-align: left; min-height: 96px; display: flex; flex-direction: column; justify-content: space-between;
    transition: background .15s, border-color .15s, transform .08s; cursor: pointer; }
  button:active { transform: scale(.97); }
  button.br { grid-column: 1 / -1; min-height: 88px; }
  button .sg { font-weight: 900; font-size: 34px; letter-spacing: -.5px; line-height: 1; }
  button .nm { font-weight: 600; font-size: 13px; color: var(--mut); letter-spacing: 1px; margin-top: 8px; }
  button.on { background: var(--acc); border-color: var(--acc); color: var(--escuro); }
  button.on .nm { color: var(--escuro); }
  button.enviando { border-color: var(--acc); }
  .sec { margin: 18px 0 8px; font-size: 13px; font-weight: 700; letter-spacing: 3px; color: var(--mut); }
  .g-gov, .g-sen { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .g-gov button, .g-sen button { min-height: 70px; padding: 10px; }
  .g-gov .sg, .g-sen .sg { font-size: 26px; }
  .g-gov .nm, .g-sen .nm { font-size: 10px; letter-spacing: .5px; margin-top: 4px; }
  .g-dep button { min-height: 70px; padding: 12px; }
  .g-dep .sg { font-size: 22px; }
  .setas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .setas button { min-height: 60px; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; }
  .aviso { margin-top: 40px; padding: 20px; border: 2px solid #d29922; border-radius: 12px; font-weight: 600; line-height: 1.5; }
  .aviso code { background: var(--card); padding: 2px 6px; border-radius: 4px; }
  footer { margin-top: 18px; font-size: 11px; color: var(--mut); text-align: center; }
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="urb.NEWS Eleições 2026">
  <div class="con" id="con"><i></i><span>conectando…</span></div>
</header>
<div id="app"></div>
<footer id="rodape">Toque numa disputa para colocá-la na tela</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="sync.js?v=20260926f"></script>
<script src="dados.js?v=20260926f"></script>
<script>
// ?tipo=resultado: controla a página de resultado (sem deputados)
const RESULTADO = new URLSearchParams(location.search).get('tipo') === 'resultado';
const LISTA = ABAS.filter(a => !(RESULTADO && a.lista));
const rotulo = a => a.id === 'br' ? 'PRESIDENTE · BRASIL' : `${a.titulo} · ${a.local}`;
const app = document.getElementById('app');
let atual = null;

if (RESULTADO) {
  document.title = 'Controle · Resultado Urbnews';
  document.getElementById('rodape').textContent = 'Toque numa disputa para exibir o resultado · toque de novo para repetir a animação';
}
if (!window.Sync) {
  app.innerHTML = `<div class="aviso">Falta o código da sala no link.<br>Use o endereço completo, ex.: <code>controle.html?sala=CÓDIGO</code></div>`;
} else {
  const botao = a => `<button data-id="${a.id}" class="${a.id === 'br' ? 'br' : ''}">
    <span class="sg">${a.curto}</span><span class="nm">${a.id === 'br' ? 'PRESIDENTE' : a.grupo === 'dep' ? 'DEPUTADO ' + a.curto : a.local}</span></button>`;
  app.innerHTML = `<div class="noar">NA TELA: <b id="noar">—</b></div>` +
    Object.keys(GRUPOS).map(g => {
      const itens = LISTA.filter(a => a.grupo === g);
      if (!itens.length) return '';
      return `${GRUPOS[g] ? `<div class="sec">${GRUPOS[g]}</div>` : ''}<div class="grade g-${g}">${itens.map(botao).join('')}</div>`;
    }).join('') +
    `<div class="setas"><button data-passo="-1">◀</button><button data-passo="1">▶</button></div>`;

  const marcar = id => {
    atual = id;
    document.querySelectorAll('[data-id]').forEach(b => b.classList.toggle('on', b.dataset.id === id));
    const a = ABAS.find(x => x.id === id);
    document.getElementById('noar').textContent = a ? rotulo(a) : '—';
  };
  const ir = id => {
    Sync.enviar(id);
    marcar(id);
    if (navigator.vibrate) navigator.vibrate(15);
  };

  app.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.id) return ir(b.dataset.id);
    const i = LISTA.findIndex(a => a.id === atual);
    ir(LISTA[(Math.max(i, 0) + +b.dataset.passo + LISTA.length) % LISTA.length].id);
  });

  Sync.on('aba', marcar);   // outra tela/controle trocou
  Sync.on('status', st => {
    const c = document.getElementById('con');
    const ok = st === 'SUBSCRIBED';
    c.classList.toggle('ok', ok);
    c.querySelector('span').innerHTML = (ok ? 'conectado' : 'reconectando…') + `<br>sala ${Sync.sala}`;
  });
}
</script>
</body>
</html>

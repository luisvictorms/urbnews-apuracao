<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarja Urbnews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* layout do PSD "TARJA BREAKING NEWS URBNEWS" (1920x1080) — fundo transparente para o vMix */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: "Rethink Sans", sans-serif; color: #fff; }
  body.xadrez { background: repeating-conic-gradient(#555 0 25%, #777 0 50%) 0 0 / 32px 32px; }   /* ?fundo=1: prévia */
  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; }

  .box { position: absolute; left: 122px; top: 501px; width: 329px; height: 201px; animation: entraEsq .6s cubic-bezier(.2,.8,.2,1) both; }
  .box img { display: block; width: 100%; height: 100%; }
  .barra { position: absolute; left: 457px; top: 501px; width: 1302px; height: 161px; background: #0e2932 url(tarjas/textura.jpg) 0 0 / 100% 100%;
    animation: abre .7s cubic-bezier(.2,.8,.2,1) .15s both; }
  .letreiro { position: absolute; left: 457px; top: 667px; width: 1302px; height: 35px; background: #0c2731; display: flex; align-items: center;
    padding: 0 16px; overflow: hidden; animation: abre .7s cubic-bezier(.2,.8,.2,1) .3s both; }
  .letreiro span { font-weight: 500; font-size: 23px; line-height: 1; text-transform: uppercase; white-space: nowrap; }
  @keyframes entraEsq { from { opacity: 0; transform: translateX(-80px); } }
  @keyframes abre { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

  .lado { position: absolute; top: 501px; width: 480px; height: 161px; text-align: center; animation: surge .5s both; }
  .lado .nm { position: absolute; left: 0; right: 0; top: 20px; font-weight: 600; font-size: 15px; letter-spacing: .3px; text-transform: uppercase; white-space: nowrap; }
  .lado .pct { position: absolute; left: 0; right: 0; top: 34px; font-weight: 800; font-size: 97px; line-height: 1; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
  .lado .pct small { font-size: .62em; letter-spacing: -1px; }
  .lado .sub { position: absolute; left: 0; right: 0; top: 128px; font-weight: 600; font-size: 15px; letter-spacing: .3px; text-transform: uppercase; white-space: nowrap; }
  .lado .tag { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 3px; background: #aefd04; color: #012128; font-weight: 800; font-size: 13px; vertical-align: 1px; }
  @keyframes surge { from { opacity: 0; transform: translateY(14px); } }

  .foto { position: absolute; top: 462px; width: 145px; height: 199px; overflow: hidden; background: #fff;
    animation: foto .6s cubic-bezier(.3,1.4,.5,1) both; }
  .foto img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; display: block; }
  .foto .ini { width: 100%; height: 100%; display: grid; place-items: center; font-weight: 800; font-size: 54px; background: linear-gradient(160deg, #2c6488, #0f3a48); }
  @keyframes foto { from { opacity: 0; transform: translateY(40px); } }
  /* deputados: os 5 mais votados lado a lado dentro da faixa */
  .dep { position: absolute; top: 501px; width: 260px; height: 161px; animation: surge .5s both; }
  .dep + .dep::before { content: ''; position: absolute; left: 0; top: 18px; bottom: 18px; width: 1px; background: rgba(255,255,255,.14); }
  .dep .ft { position: absolute; left: 16px; top: 20px; width: 88px; height: 121px; background: #fff; overflow: hidden; }
  .dep .ft img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; display: block; }
  .dep .ft .ini { width: 100%; height: 100%; display: grid; place-items: center; font-weight: 800; font-size: 34px; background: linear-gradient(160deg, #2c6488, #0f3a48); }
  .dep .rk { position: absolute; left: 116px; top: 18px; font-weight: 800; font-size: 13px; letter-spacing: .5px; color: #aefd04; white-space: nowrap; }
  .dep .rk .tag { margin-left: 6px; padding: 1px 6px; border-radius: 3px; background: #aefd04; color: #012128; font-size: 11px; }
  .dep .nm { position: absolute; left: 116px; right: 8px; top: 36px; font-weight: 700; line-height: 1.05; text-transform: uppercase; }
  .dep .pa { position: absolute; left: 116px; right: 8px; top: 76px; font-weight: 500; font-size: 12px; color: #cfe0e6; text-transform: uppercase; white-space: nowrap; }
  .dep .pc { position: absolute; left: 116px; top: 94px; font-weight: 800; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; }
  .dep .pc small { font-size: .6em; }
  .dep .vt { position: absolute; left: 116px; top: 128px; font-weight: 500; font-size: 12px; color: #e6eef0; white-space: nowrap; }
  .aviso { position: absolute; left: 457px; top: 540px; width: 1302px; text-align: center; font-weight: 600; font-size: 28px; color: #cfe0e6; }
  .sim { position: absolute; left: 1640px; top: 470px; background: #d29922; color: #000; font-weight: 800; font-size: 14px; padding: 3px 8px; border-radius: 3px; }
</style>
</head>
<body>
<div id="stage"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="sync.js?v=20261004a"></script>
<script src="dados.js?v=20261004a"></script>
<script src="pesquisas.js?v=20261004a"></script>
<script src="exportar.js?v=20261004a"></script>
<script>
// Tarja (lower third) para o vMix, fundo transparente.
//   ?tipo=apuracao#ce  → os 2 mais votados da disputa (deputados #df-ce / #de-ce: os 5 mais votados) (TSE, atualiza sozinha; &sala= segue o controle do celular; &sim=1 simulação)
//   ?tipo=pesquisa&p=<id da pesquisa> → os 2 primeiros da pesquisa + dados legais no letreiro
//   &texto=... troca o letreiro · &fundo=1 mostra xadrez atrás (só prévia)
const TIPO = Q.get('tipo') === 'pesquisa' ? 'pesquisa' : 'apuracao';
if (Q.get('fundo') === '1') document.body.classList.add('xadrez');
const stage = document.getElementById('stage');
const DISPUTAS = ABAS;   // deputados (aba.lista) viram a tarja dos 5 mais votados
let atual = Math.max(0, DISPUTAS.findIndex(a => a.id === (location.hash.slice(1) || Q.get('aba'))));
let chaveAtual = '', t0 = performance.now();

const fnum = (n, casas) => n.toLocaleString('pt-BR', { minimumFractionDigits: casas, maximumFractionDigits: casas });
const iniciais = n => n.replace(/^(DR\.|DRA\.|PROFESSORA?|CORONEL|CABO|CAPITÃO|DELEGADO)\s+/i, '').split(' ')
  .filter(w => !/^(DE|DA|DO|DOS|DAS|E)$/i.test(w)).map(w => w[0]).slice(0, 2).join('').toUpperCase();

// ---------- dados de cada tipo → { cands:[{nome, pct, sub, foto, tag}], letreiro, casas } ----------
function daApuracao() {
  const aba = DISPUTAS[atual];
  const r = resultado(aba);
  const rot = aba.id === 'br' ? 'PRESIDENTE DO BRASIL' : `${aba.titulo} · ${aba.local}`;
  if (!r || !r.cands.length) return { aba, vazio: 'Aguardando os primeiros resultados do TSE…', letreiro: `APURAÇÃO DE VOTOS EM TEMPO REAL · ${rot}` };
  const tag = c => c.st.startsWith('ELEITO') ? 'ELEITO' : c.st === '2º TURNO' ? '2º TURNO' : '';
  return {
    aba, casas: 2, lista: !!aba.lista,
    cands: r.cands.slice(0, aba.lista ? 5 : 2).map(c => ({ nome: c.nome, partido: c.partido, pct: c.pct, sub: c.votos ? `${c.votos.toLocaleString('pt-BR')} VOTOS` : '', foto: c.foto, tag: tag(c) })),
    letreiro: `APURAÇÃO DE VOTOS EM TEMPO REAL · ${rot}${aba.lista ? ' · MAIS VOTADOS' : ''}${r.turno === 2 ? ' · 2º TURNO' : ''} · ${fnum(r.secoes, 2)}% DAS SEÇÕES APURADAS · FONTE: TSE`,
  };
}
function daPesquisa() {
  const P = PESQUISAS.find(p => p.id === Q.get('p')) || PESQUISAS[0];
  const cands = P.itens.filter(i => i.tipo !== 'outro').sort((a, b) => b.pct - a.pct).slice(0, 2);
  const inst = P.instituto.charAt(0) + P.instituto.slice(1).toLowerCase();
  return {
    casas: 0, pesquisa: P,
    cands: cands.map(c => ({ nome: c.nome, pct: c.pct, sub: `${c.partido || ''} · ${P.instituto}`, foto: c.foto ? `fotos-pesquisa/${c.foto}.jpg?v=2` : '' })),
    letreiro: `PESQUISA ${P.instituto} (${P.divulgacao}) · ${P.cargo} · ${P.local}${P.turno && P.turno !== '1º TURNO' ? ' · ' + P.turno : ''} · ` +
      `REG. ${P.registro} · ${P.entrevistas} ENTREVISTAS DE ${P.campo} · MARGEM ${P.margem} · CONFIANÇA ${P.confianca} · CONTRATANTE: ${P.contratante}`,
  };
}
const dadosAtuais = () => TIPO === 'pesquisa' ? daPesquisa() : daApuracao();

// ---------- montagem ----------
const X = [772, 1418], XF = [954, 1115];     // centros dos números e posição das fotos (PSD)
const T = i => ({ foto: 650 + i * 150, num: 750 + i * 150, dur: 900 });
function montar(d) {
  let h = `<div class="box"><img src="tarjas/logo-box.png" alt="urb.NEWS Eleições 2026"></div>
    <div class="barra"></div>
    <div class="letreiro"><span id="letreiro">${esc(Q.get('texto') || d.letreiro)}</span></div>`;
  const foto = c => c.foto ? `<img src="${esc(c.foto)}" alt="" onerror="this.outerHTML='<div class=ini>${esc(iniciais(c.nome))}</div>'">` : `<div class="ini">${esc(iniciais(c.nome))}</div>`;
  if (d.vazio) h += `<div class="aviso">${esc(d.vazio)}</div>`;
  else if (d.lista) d.cands.forEach((c, i) => {
    const t = T(i), fs = c.nome.length > 22 ? 13 : c.nome.length > 16 ? 14.5 : 16;
    h += `<div class="dep" style="left:${457 + i * 260.4}px;animation-delay:${t.foto}ms">
      <div class="ft">${foto(c)}</div>
      <div class="rk">${i + 1}º${c.tag ? `<span class="tag">${c.tag}</span>` : ''}</div>
      <div class="nm" style="font-size:${fs}px">${esc(c.nome)}</div>
      <div class="pa">${esc(c.partido || '')}</div>
      <div class="pc conta" data-i="${i}" data-alvo="${c.pct}">${fnum(c.pct, d.casas)}<small>%</small></div>
      <div class="vt" data-sub="${i}">${esc(c.sub)}</div>
    </div>`;
  });
  else d.cands.forEach((c, i) => {
    const t = T(i);
    h += `<div class="foto" style="left:${XF[i]}px;animation-delay:${t.foto}ms">${c.foto
        ? `<img src="${esc(c.foto)}" alt="" onerror="this.outerHTML='<div class=ini>${esc(iniciais(c.nome))}</div>'">` : `<div class="ini">${esc(iniciais(c.nome))}</div>`}</div>
      <div class="lado" style="left:${X[i] - 240}px;animation-delay:${t.num - 100}ms">
        <div class="nm">${esc(c.nome)}${c.tag ? `<span class="tag">${c.tag}</span>` : ''}</div>
        <div class="pct conta" data-i="${i}" data-alvo="${c.pct}">${fnum(c.pct, d.casas)}<small>%</small></div>
        <div class="sub" data-sub="${i}">${esc(c.sub)}</div>
      </div>`;
  });
  if (SIM && TIPO === 'apuracao') h += '<div class="sim">SIMULAÇÃO 2022</div>';
  stage.innerHTML = h;
  caberLetreiro();
}
function caberLetreiro() {
  const el = document.getElementById('letreiro'); let fs = 23;
  el.style.fontSize = fs + 'px';
  while (el.scrollWidth > 1302 - 32 && fs > 13) el.style.fontSize = --fs + 'px';
}

let casasAtual = 2;
function contagens(ms) {
  let ativo = false;
  document.querySelectorAll('.conta').forEach(el => {
    const t = T(+el.dataset.i), alvo = +el.dataset.alvo;
    const p = Math.min(1, Math.max(0, (ms - t.num) / t.dur));
    if (p < 1) ativo = true;
    el.innerHTML = fnum(alvo * (1 - Math.pow(1 - p, 3)), casasAtual) + '<small>%</small>';
  });
  return ativo;
}
window.__tick = contagens;

// redesenha com animação só quando mudam os candidatos; senão atualiza números e letreiro no lugar
function mostrar(forcar) {
  const d = dadosAtuais();
  casasAtual = d.casas ?? 2;
  const k = (d.aba ? d.aba.id : '') + (d.vazio ? ':vazio' : d.cands.map(c => c.nome + c.tag).join('|'));
  if (k !== chaveAtual || forcar) {
    chaveAtual = k; montar(d); t0 = performance.now();
    if (!EXPORT) { const loop = () => { if (contagens(performance.now() - t0)) requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
  } else if (!d.vazio) {
    d.cands.forEach((c, i) => {
      const el = stage.querySelector(`.conta[data-i="${i}"]`);
      if (el) { el.dataset.alvo = c.pct; el.innerHTML = fnum(c.pct, casasAtual) + '<small>%</small>'; }
      const s = stage.querySelector(`[data-sub="${i}"]`); if (s) s.textContent = c.sub;
    });
    if (!Q.get('texto')) { document.getElementById('letreiro').textContent = d.letreiro; caberLetreiro(); }
  }
  if (EXPORT && !window.__exportPronto && (TIPO === 'pesquisa' || !d.vazio)) { window.__exportPronto = true; Exportar.marcarPronto(); }
}

function selecionar(i, remoto) {
  atual = (i + DISPUTAS.length) % DISPUTAS.length;
  history.replaceState(null, '', location.search + '#' + DISPUTAS[atual].id);
  if (!remoto && window.Sync) Sync.enviar(DISPUTAS[atual].id);
  mostrar(true);
  ciclo([DISPUTAS[atual]]);
}

function escala() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `scale(${s}) translate(-50%, -50%)`;
}
addEventListener('resize', escala);
escala();

if (TIPO === 'pesquisa') {
  document.title = 'Tarja · pesquisa';
  mostrar(true);
} else {
  document.title = 'Tarja · apuração';
  window.aoAtualizar = () => mostrar(false);
  addEventListener('keydown', e => {
    const i = DISPUTAS.findIndex(a => a.id === abaPorTecla(e));
    if (i >= 0) selecionar(i);
    else if (e.key === 'ArrowRight' || e.key === ' ') selecionar(atual + 1);
    else if (e.key === 'ArrowLeft') selecionar(atual - 1);
    else if (e.key.toLowerCase() === 'r') mostrar(true);
  });
  addEventListener('hashchange', () => {
    const i = DISPUTAS.findIndex(a => a.id === location.hash.slice(1));
    if (i >= 0 && i !== atual) selecionar(i, true);
  });
  if (window.Sync) {
    Sync.on('aba', id => { const i = DISPUTAS.findIndex(a => a.id === id); if (i >= 0) selecionar(i, true); });
    Sync.on('ola', () => Sync.enviar(DISPUTAS[atual].id));
  }
  mostrar(true);
  ciclo([DISPUTAS[atual]]);
  if (!EXPORT) setInterval(() => ciclo([DISPUTAS[atual]]), SIM ? 5000 : 15000);
}
</script>
</body>
</html>
